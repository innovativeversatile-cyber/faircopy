<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fair Copy card</title>
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #efe8d8;
      color: #1d1a16;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 1040px;
      height: 470px;
      background: #faf6ee;
      box-shadow: 0 1px 0 rgba(29,26,22,.06), 0 24px 50px rgba(29,26,22,.12);
      padding: 72px 80px 64px;
      box-sizing: border-box;
    }
    .mark {
      font-size: 28px;
      border-bottom: 1px solid #6c5930;
      display: inline;
      padding-bottom: 2px;
    }
    h1 {
      font-weight: 400;
      font-size: 58px;
      line-height: 1.12;
      margin: 36px 0 22px;
      letter-spacing: -0.02em;
      max-width: 16ch;
    }
    p {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 24px;
      line-height: 1.4;
      max-width: 36ch;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="mark">Fair Copy</span>
    <h1>Your papers never leave this device.</h1>
    <p>Turn photos into a PDF in the browser. Nothing is uploaded.</p>
  </div>
</body>
</html>
